<svg viewBox="0 0 540 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- App icon background -->
  <rect x="10" y="10" width="520" height="380" rx="80" fill="url(#bg)"/>

  <!-- WV ligature: W's last stroke flows straight into V, all as one wavy ribbon -->
  <path d="M 90 130
           C 105 190, 130 260, 150 290
           C 170 250, 185 210, 200 210
           C 215 210, 230 250, 250 290
           C 275 250, 300 190, 320 130
           C 340 190, 365 250, 390 290
           C 410 250, 435 190, 450 130"
        fill="none" stroke="#FFFFFF" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent dot: a single wave crest highlight -->
  <circle cx="200" cy="210" r="10" fill="#0F172A" opacity="0.5"/>
</svg>
