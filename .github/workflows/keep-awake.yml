name: Keep WAYVO backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s -o /dev/null -m 120 -w "%{http_code}\n" https://wayvo-fresh-1.onrender.com/api/chats || echo "ping failed"
