name: Deploy WAYVO Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WAYVO Web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./wayvo/build/web

      - name: Deploy WAYVO
        id: deployment
        uses: actions/deploy-pages@v4
