name: Deploy WAYVO Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r site/* _site/
          if [ -d wayvo/build/web ]; then
            cp -r wayvo/build/web/* _site/app/
            sed -i 's#<base href="[^"]*">#<base href="/wayvo-fresh/app/">#' _site/app/index.html
          fi

      - name: Upload WAYVO Web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy WAYVO
        id: deployment
        uses: actions/deploy-pages@v4
